#!name = 哔哩哔哩去广告（Quantumult X 修复版）
#!desc = 按 Loon 插件「哔哩哔哩去广告」(kelee.one，作者 kokoryh) 移植，修复墨鱼 BiliBiliAds.conf 导致评论区加载不出来的问题。
#!author = reawake97
#!homepage = https://github.com/reawake97/bilibili_remove_ad
#!icon = https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bilibili.png
#!date = 2026-10-28
#
# 需要支持 jsonjq-response-body 的 Quantumult X（build 845 及以上）。
# 可选分流规则（对应 Loon 插件的 [Rule]）：Bilibili_remove_ads.list
# 若启用后评论区仍有问题，可改用不解密 gRPC 的精简版：Bilibili_remove_ads_lite.conf

hostname = app.bilibili.com, api.bilibili.com, api.live.bilibili.com, grpc.biliapi.net, line3-h5-mobile-api.biligame.com, manga.bilibili.com

# ======= 开屏广告 =======
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/(show|event\/list2)\? url jsonjq-response-body 'if (.data | type) == "object" then .data |= with_entries(if .key == "show" or .key == "event_list" then .value = [] else . end) else . end'
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list\? url jsonjq-response-body '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'

# ======= 首页：标签页、推荐流、竖屏视频流、右上角活动、热搜发现 =======
^https:\/\/app\.bilibili\.com\/x\/resource\/show\/tab\/v2\? url script-response-body https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.json.js
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\? url jsonjq-response-body 'if (.data.items | type) == "array" then .data.items |= map(select(.banner_item == null and .ad_info == null and .card_goto == "av" and (.card_type == "small_cover_v2" or .card_type == "large_cover_single_v9" or .card_type == "large_cover_v1"))) else . end'
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\/story\? url jsonjq-response-body 'if (.data.items | type) == "array" then .data.items |= map(select(.ad_info == null and .card_goto != "vertical_ad_av" and .card_goto != "vertical_ad_live" and .card_goto != "vertical_ad_picture") | del(.story_cart_icon, .free_flow_toast, .image_infos, .course_info, .game_info)) else . end'
^https:\/\/ap[ip]\.bilibili\.com\/x\/(resource\/(top\/activity|patch\/tab(\/v2)?)|v2\/search\/square|vip\/ads\/materials)\? url jsonjq-response-body '{"code":-404,"message":"-404","ttl":1,"data":null}'

# ======= 我的页面、统一皮肤 =======
^https:\/\/app\.bilibili\.com\/x\/v2\/account\/mine(\/ipad)?\? url script-response-body https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.json.js
^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\? url jsonjq-response-body 'del(.data.common_equip)'

# ======= 番剧 / 影视 =======
^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\? url jsonjq-response-body '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\? url jsonjq-response-body 'del(.data.payment)'
^https:\/\/api\.bilibili\.com\/pgc\/page\/channel\? url jsonjq-response-body 'if (.data.modules | type) == "array" then .data.modules |= map(select(.type != "TIP") | if .type == "BANNER" and (.module_data.items | type) == "array" then .module_data.items |= map(select(((.url | type) == "string" and (.url | startswith("https://www.bilibili.com/blackboard/era/"))) | not)) else . end) else . end'

# ======= 直播 =======
^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\? url reject-dict
^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material\? url reject-dict
^https:\/\/api\.live\.bilibili\.com\/xlive\/(app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(Room|User))\? url script-response-body https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.json.js

# ======= P2P：把 tracker / STUN 指向固定域名，配合 Bilibili_remove_ads.list 中的拒绝规则禁用 P2P 上传 =======
^https:\/\/api\.bilibili\.com\/x\/pd-proxy\/tracker\? url jsonjq-response-body 'if (.data | type) == "object" or (.data | type) == "array" then .data[][]? = "stun.chat.bilibili.com:3478" else . end'
^https:\/\/api\.live\.bilibili\.com\/xlive\/open-interface\/v2\/tracker\/conf\? url jsonjq-response-body 'if (.data | type) == "object" then .data.domains = ["wss://tracker.chat.bilibili.com"] else . end'

# ======= gRPC：直接返回空响应（青少年模式弹窗、搜索默认词、免流提示、暂停 / 结束页广告）=======
^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.(interface\.v1\.(Teenagers\/ModeStatus|Search\/DefaultWords)|view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(PlayPause|ViewEndPage))$ url script-request-header https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.grpc.js

# ======= gRPC：去广告，并为改写过的响应补上 grpc-status 响应头（评论区加载失败的修复点）=======
# 视频详情 View/View、评论区 Reply/MainList、动态、热门、搜索、弹幕、播放器提示条
^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.(show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(unite)?\.v1\.View\/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$ url script-response-body https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.grpc.js

# ======= gRPC：优化评论区加载（可选，对应 Loon 插件 optimizeRequest，去掉下一行行首的 # 启用）=======
# 脚本自行请求 View/View 与 Reply/MainList，grpc.biliapi.net 失败时换 app.bilibili.com；全部失败则放行原请求
# ^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$ url script-request-body https://raw.githubusercontent.com/reawake97/bilibili_remove_ad/main/scripts/bilibili.grpc.js

# ======= 附加：墨鱼原配置中 Loon 插件未覆盖的规则（均为普通 JSON 接口，不影响评论区）=======
# 番剧播放页小卡片、「点击追番」卡片
^https:\/\/api\.bilibili\.com\/pgc\/season\/player\/(ogv\/)?cards url reject-dict
^https:\/\/api\.bilibili\.com\/x\/vip\/ads\/material\/report url reject-dict
# 白色版（国际版）搜索框默认词
^https:\/\/app\.bilibili\.com\/x\/v\d\/search\/defaultwords url reject-dict
# 哔哩哔哩漫画
^https:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/(Flash|ListFlash|GetActivityTab) url reject-dict
