name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get install -y jq
      - run: node --check scripts/bilibili.grpc.js && node --check scripts/bilibili.json.js
      - run: node --test test/*.test.mjs
